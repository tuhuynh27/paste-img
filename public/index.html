<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pasteimg</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0d0c;
    --panel: #161412;
    --line: #2a2723;
    --text: #ece7df;
    --dim: #8a837a;
    --safe: #ff5b1f;
    --ok: #9be564;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --display: "Bricolage Grotesque", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html { color-scheme: dark; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 400 14px/1.6 var(--mono);
    min-height: 100vh;
    padding: 0 20px 80px;
  }
  main { max-width: 760px; margin: 0 auto; }

  header { padding: 56px 0 36px; }
  .tag { color: var(--safe); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; }
  h1 {
    font: 700 clamp(44px, 9vw, 76px)/.95 var(--display);
    letter-spacing: -.035em;
    margin: 14px 0 16px;
  }
  header p { color: var(--dim); max-width: 46ch; }
  kbd {
    font: inherit; font-size: 12px; color: var(--text);
    border: 1px solid var(--line); border-bottom-width: 2px;
    padding: 1px 6px; border-radius: 3px;
  }

  /* drop frame with crop marks */
  .frame {
    position: relative;
    display: block;
    width: 100%;
    padding: 56px 24px;
    background: var(--panel);
    border: 0;
    color: inherit; font: inherit;
    text-align: left;
    cursor: pointer;
    outline: none;
    transition: background .15s;
  }
  .frame::before, .frame::after, .frame i::before, .frame i::after {
    content: ""; position: absolute; width: 18px; height: 18px;
    border: 2px solid var(--dim);
    transition: border-color .15s, transform .15s;
  }
  .frame::before { top: 0; left: 0; border-right: 0; border-bottom: 0; }
  .frame::after { top: 0; right: 0; border-left: 0; border-bottom: 0; }
  .frame i::before { bottom: 0; left: 0; border-right: 0; border-top: 0; }
  .frame i::after { bottom: 0; right: 0; border-left: 0; border-top: 0; }
  .frame:hover, .frame:focus-visible, .frame.drag { background: #1c1815; }
  .frame:hover::before, .frame:hover::after, .frame:hover i::before, .frame:hover i::after,
  .frame:focus-visible::before, .frame:focus-visible::after,
  .frame:focus-visible i::before, .frame:focus-visible i::after,
  .frame.drag::before, .frame.drag::after, .frame.drag i::before, .frame.drag i::after {
    border-color: var(--safe);
  }
  .frame.drag::before, .frame.drag::after, .frame.drag i::before, .frame.drag i::after { width: 28px; height: 28px; }
  .frame strong { display: block; font: 500 22px/1.3 var(--display); letter-spacing: -.01em; }
  .frame span { color: var(--dim); }

  .token { margin-top: 14px; display: none; gap: 10px; align-items: center; }
  .token.show { display: flex; }
  .token label { color: var(--safe); font-size: 12px; text-transform: uppercase; letter-spacing: .1em; }
  .token input {
    flex: 1; background: var(--panel); border: 1px solid var(--line);
    color: var(--text); font: inherit; font-size: 16px; padding: 8px 10px; border-radius: 0;
  }
  .token input:focus { outline: 2px solid var(--safe); outline-offset: -1px; }

  .actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 14px; }
  .btn.primary { background: var(--safe); border-color: var(--safe); color: #0e0d0c; font-weight: 500; padding: 10px 16px; }
  .btn.primary:hover, .btn.primary:focus-visible { background: transparent; color: var(--safe); }
  .hint { color: var(--dim); font-size: 12px; min-height: 1.6em; }
  .hint.err { color: var(--safe); }
  .catch {
    display: none; flex: 1 1 100%; padding: 12px; border: 1px dashed var(--line);
    color: var(--dim); font-size: 16px; min-height: 44px; outline: none;
    -webkit-user-select: text; user-select: text;
  }
  .catch.show { display: block; }
  .catch:focus { border-color: var(--safe); color: var(--text); }
  .catch:empty::before { content: attr(data-ph); }

  /* results */
  .bar {
    display: none; justify-content: space-between; align-items: center;
    margin: 44px 0 10px; color: var(--dim); font-size: 12px;
    letter-spacing: .1em; text-transform: uppercase;
  }
  .bar.show { display: flex; }
  .btn {
    background: none; border: 1px solid var(--line); color: var(--text);
    font: inherit; font-size: 12px; padding: 6px 12px; cursor: pointer;
    letter-spacing: .06em; text-transform: uppercase; transition: border-color .15s, color .15s;
  }
  .btn:hover, .btn:focus-visible { border-color: var(--safe); color: var(--safe); outline: none; }
  .btn.done { border-color: var(--ok); color: var(--ok); }

  .all {
    display: none; width: 100%; margin-bottom: 14px; resize: vertical;
    background: var(--panel); border: 1px solid var(--line); color: var(--text);
    font: inherit; font-size: 16px; line-height: 1.5; padding: 10px 12px; border-radius: 0;
    white-space: pre; overflow: auto;
  }
  .all.show { display: block; }
  .all:focus { outline: 2px solid var(--safe); outline-offset: -1px; }

  ol { list-style: none; padding: 0; }
  li {
    display: grid;
    grid-template-columns: 28px 64px 1fr auto;
    gap: 14px; align-items: center;
    padding: 12px 0; border-top: 1px solid var(--line);
    animation: in .25s ease-out;
  }
  li:last-child { border-bottom: 1px solid var(--line); }
  .n { color: var(--dim); font-size: 12px; }
  .thumb {
    width: 64px; height: 64px; background: var(--panel) center/cover no-repeat;
    border: 1px solid var(--line);
  }
  .url {
    color: var(--text); text-decoration: none; word-break: break-all;
    display: block;
  }
  .url:hover { color: var(--safe); }
  .meta { color: var(--dim); font-size: 12px; }
  li.err .meta { color: var(--safe); }
  li.busy .meta::after { content: ""; display: inline-block; width: 60px; height: 2px; margin-left: 8px; vertical-align: middle; background: linear-gradient(90deg, var(--safe) 50%, transparent 50%) 0 0/20px 2px; animation: run .6s linear infinite; }

  @keyframes in { from { opacity: 0; transform: translateY(6px); } }
  @keyframes run { to { background-position: 20px 0; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  @media (max-width: 520px) {
    li { grid-template-columns: 52px 1fr auto; }
    .n { display: none; }
    .thumb { width: 52px; height: 52px; }
  }
</style>
</head>
<body>
<main>
  <header>
    <div class="tag">Image relay / public URLs</div>
    <h1>Paste.<br>Get a link.</h1>
    <p>Hand screenshots to an agent over SSH. Press <kbd>Ctrl</kbd>+<kbd>V</kbd> anywhere on this page, drop files, or browse.</p>
  </header>

  <button class="frame" id="drop" type="button" aria-label="Choose or drop images">
    <i></i>
    <strong>Drop images here</strong>
    <span>or click to browse. Multiple files supported.</span>
  </button>
  <input id="file" type="file" accept="image/*" multiple hidden>

  <div class="actions">
    <button class="btn primary" id="pasteBtn" type="button">Paste from clipboard</button>
    <span class="hint" id="hint" role="status"></span>
    <div class="catch" id="catch" contenteditable="true" role="textbox" aria-label="Paste target"
         data-ph="Touch and hold here, then tap Paste"></div>
  </div>

  <div class="token" id="tokenRow">
    <label for="token">Token</label>
    <input id="token" type="password" autocomplete="off" placeholder="Upload token required">
  </div>

  <div class="bar" id="bar">
    <span id="count"></span>
    <button class="btn" id="copyAll" type="button">Copy all URLs</button>
  </div>
  <textarea class="all" id="all" readonly rows="3" aria-label="All image URLs" spellcheck="false"></textarea>
  <ol id="list" aria-live="polite"></ol>
</main>

<script>
const $ = (id) => document.getElementById(id);
const drop = $('drop'), fileIn = $('file'), list = $('list'), bar = $('bar');
const tokenIn = $('token'), tokenRow = $('tokenRow');
const urls = [];
let seq = 0;

const store = {
  get: () => { try { return localStorage.getItem('pasteimg-token') || ''; } catch { return ''; } },
  set: (v) => { try { localStorage.setItem('pasteimg-token', v); } catch {} },
};
tokenIn.value = store.get();
tokenIn.addEventListener('input', () => store.set(tokenIn.value));

fetch('/api/config').then((r) => r.json()).then((c) => {
  if (c.tokenRequired) tokenRow.classList.add('show');
}).catch(() => {});

async function copy(text, btn, label) {
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const t = Object.assign(document.createElement('textarea'), { value: text });
    document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove();
  }
  if (!btn) return;
  btn.classList.add('done'); btn.textContent = 'Copied';
  setTimeout(() => { btn.classList.remove('done'); btn.textContent = label; }, 1200);
}

function fmt(b) { return b > 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.ceil(b / 1024) + ' KB'; }

function refreshBar() {
  bar.classList.toggle('show', list.children.length > 0);
  $('count').textContent = urls.length + ' ready';
  $('copyAll').style.display = urls.length > 1 ? '' : 'none';

  const all = $('all');
  all.classList.toggle('show', urls.length > 1);
  all.value = urls.join('\n');
  all.rows = Math.min(Math.max(urls.length, 2), 8);
}

async function send(file) {
  const n = String(++seq).padStart(2, '0');
  const li = document.createElement('li');
  li.className = 'busy';
  li.innerHTML = '<span class="n"></span><div class="thumb"></div><div><span class="url"></span><span class="meta"></span></div><button class="btn" type="button" hidden>Copy</button>';
  li.querySelector('.n').textContent = n;
  li.querySelector('.thumb').style.backgroundImage = `url(${URL.createObjectURL(file)})`;
  li.querySelector('.url').textContent = file.name || 'pasted image';
  li.querySelector('.meta').textContent = fmt(file.size) + ' uploading';
  list.prepend(li);
  refreshBar();

  const btn = li.querySelector('button'), meta = li.querySelector('.meta'), link = li.querySelector('.url');
  try {
    const res = await fetch('/api/upload', {
      method: 'POST',
      headers: { 'x-token': tokenIn.value },
      body: file,
    });
    const data = await res.json().catch(() => ({}));
    if (res.status === 401) tokenRow.classList.add('show');
    if (!res.ok) throw new Error(data.error || 'Upload failed');

    li.className = '';
    const a = Object.assign(document.createElement('a'), { className: 'url', href: data.url, target: '_blank', rel: 'noopener', textContent: data.url });
    link.replaceWith(a);
    meta.textContent = fmt(data.bytes);
    btn.hidden = false;
    btn.onclick = () => copy(data.url, btn, 'Copy');
    urls.push(data.url);
    refreshBar();
    return data.url;
  } catch (e) {
    li.className = 'err';
    meta.textContent = e.message;
  }
}

async function handle(files) {
  const imgs = [...files].filter((f) => f.type.startsWith('image/'));
  if (!imgs.length) return;
  const got = (await Promise.all(imgs.map(send))).filter(Boolean);
  if (got.length) copy(got.join('\n')).catch?.(() => {});
}

function clipFiles(dt) {
  const files = [...(dt?.files || [])];
  if (files.length) return files;
  return [...(dt?.items || [])]
    .filter((i) => i.kind === 'file')
    .map((i) => i.getAsFile())
    .filter(Boolean);
}

function onPaste(e) {
  if (e.target === tokenIn) return;
  const files = clipFiles(e.clipboardData);
  if (files.length) { e.preventDefault(); handle(files); return; }
  if (e.target === catcher) e.preventDefault();
  say('No image in clipboard', true);
}
document.addEventListener('paste', onPaste);

const hint = $('hint'), catcher = $('catch');
function say(msg, bad) {
  hint.textContent = msg;
  hint.classList.toggle('err', !!bad);
}

// iOS Safari has no document-level paste without a focused editable
// element, so offer an explicit button plus an editable paste target.
$('pasteBtn').addEventListener('click', async () => {
  say('');
  if (!navigator.clipboard?.read) {
    catcher.classList.add('show');
    catcher.focus();
    say('Browser blocks direct paste. Use the box below.');
    return;
  }
  try {
    const items = await navigator.clipboard.read();
    const files = [];
    for (const item of items) {
      const type = item.types.find((t) => t.startsWith('image/'));
      if (!type) continue;
      const blob = await item.getType(type);
      files.push(new File([blob], 'pasted.' + type.split('/')[1], { type }));
    }
    if (files.length) handle(files);
    else say('No image in clipboard', true);
  } catch (e) {
    catcher.classList.add('show');
    say(e.name === 'NotAllowedError' ? 'Paste was blocked. Try the box below.' : 'Paste failed. Try the box below.', true);
  }
});

catcher.addEventListener('input', () => { catcher.textContent = ''; });

drop.addEventListener('click', () => fileIn.click());
fileIn.addEventListener('change', () => { handle(fileIn.files); fileIn.value = ''; });

['dragenter', 'dragover'].forEach((t) => document.addEventListener(t, (e) => {
  e.preventDefault(); drop.classList.add('drag');
}));
['dragleave', 'drop'].forEach((t) => document.addEventListener(t, (e) => {
  e.preventDefault();
  if (t === 'drop' || e.target === document.documentElement || !e.relatedTarget) drop.classList.remove('drag');
}));
document.addEventListener('drop', (e) => handle(e.dataTransfer.files));

$('all').addEventListener('focus', (e) => e.target.select());
$('copyAll').addEventListener('click', (e) => copy(urls.join('\n'), e.currentTarget, 'Copy all URLs'));
</script>
</body>
</html>
